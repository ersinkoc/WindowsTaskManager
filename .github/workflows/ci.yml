name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # Frontend tests and build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "frontend/node_modules"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Type check
        run: npm run typecheck --prefix frontend

      - name: Run unit tests
        run: npm test --prefix frontend

      - name: Build for production
        run: npm run build --prefix frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Backend tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Go ${{ env.GO_VERSION }})
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Build binary
        run: go build -ldflags="-s -w" -o WindowsTaskManager.exe ./cmd/wtm/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wtm-binary
          path: WindowsTaskManager.exe
          retention-days: 7

  # ─────────────────────────────────────────────
  # Security audit
  # ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "frontend/node_modules"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run npm audit
        run: npm audit --prefix frontend --audit-level=moderate

  # ─────────────────────────────────────────────
  # Integration test (requires running server)
  # ─────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: windows-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" -o WindowsTaskManager.exe ./cmd/wtm/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Start server in background
        run: ./WindowsTaskManager.exe &
        shell: bash

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19876/api/v1/info && exit 0
            sleep 1
          done
          exit 1

      - name: Run smoke tests
        run: |
          curl -s http://127.0.0.1:19876/api/v1/info | grep -q "version" && echo "API OK"
          curl -s http://127.0.0.1:19876/ | grep -q "<" && echo "Frontend OK"

      - name: Stop server
        run: taskkill //F //IM WindowsTaskManager.exe 2>/dev/null || true